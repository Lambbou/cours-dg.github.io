<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 1 : Fondements POO & Associations UML — ENSSAT IAI 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003366;
      --primary-light: #0055a5;
      --secondary: #0077b6;
      --accent: #e65100;
      --accent-light: #ff833a;
      --dark: #212529;
      --light-bg: #f5f7fa;
      --card-bg: #ffffff;
      --success: #28a745;
      --success-light: #e8f5e9;
      --danger: #dc3545;
      --danger-light: #ffebee;
      --border: #e2e8f0;
      --text: #2d3748;
      --text-muted: #718096;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(0, 51, 102, 0.08), 0 8px 10px -6px rgba(0, 51, 102, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2eafc 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-enssat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 51, 102, 0.2);
    }

    .badge-enssat span {
      color: var(--accent-light);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 32px 28px;
      transition: all 0.3s ease;
    }

    /* Progress bar */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-meta .current-score {
      color: var(--secondary);
      font-weight: 700;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary) 0%, var(--accent) 100%);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* Question content */
    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .question-text {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Choices */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .choice-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .choice-item:hover:not(.locked) {
      border-color: var(--secondary);
      background: #f0f8ff;
      transform: translateY(-1px);
    }

    .choice-letter {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #edf2f7;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .choice-item:hover:not(.locked) .choice-letter {
      background: var(--secondary);
      color: white;
    }

    .choice-item.selected {
      border-color: var(--secondary);
      background: #e6f3fa;
    }

    .choice-item.selected .choice-letter {
      background: var(--secondary);
      color: white;
    }

    /* Feedback states */
    .choice-item.correct {
      border-color: var(--success) !important;
      background: var(--success-light) !important;
      color: #1b5e20;
    }

    .choice-item.correct .choice-letter {
      background: var(--success) !important;
      color: white !important;
    }

    .choice-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-light) !important;
      color: #b71c1c;
    }

    .choice-item.incorrect .choice-letter {
      background: var(--danger) !important;
      color: white !important;
    }

    .choice-item.locked {
      cursor: default;
    }

    /* Feedback box */
    .feedback-box {
      margin-top: 20px;
      padding: 18px 20px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 5px solid var(--secondary);
      animation: fadeIn 0.3s ease;
    }

    .feedback-box.correct {
      border-left-color: var(--success);
      background: #f0fdf4;
    }

    .feedback-box.incorrect {
      border-left-color: var(--danger);
      background: #fef2f2;
    }

    .feedback-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .feedback-box.correct .feedback-header {
      color: #15803d;
    }

    .feedback-box.incorrect .feedback-header {
      color: #b91c1c;
    }

    .feedback-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #334155;
    }

    /* Action buttons */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 51, 102, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-accent {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(230, 81, 0, 0.25);
    }

    .btn-accent:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    /* Results Screen */
    .results-card {
      text-align: center;
      padding: 40px 24px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(0, 119, 182, 0.3);
    }

    .score-value {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-total {
      font-size: 0.95rem;
      opacity: 0.85;
      font-weight: 600;
    }

    .result-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 14px;
    }

    .badge-excellent {
      background: #dcfce7;
      color: #166534;
    }

    .badge-good {
      background: #e0f2fe;
      color: #075985;
    }

    .badge-review {
      background: #fef3c7;
      color: #92400e;
    }

    .result-message {
      color: var(--text);
      font-size: 1rem;
      line-height: 1.5;
      max-width: 540px;
      margin: 0 auto 30px;
    }

    .review-list {
      text-align: left;
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .review-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .review-item.pass .review-item-header {
      color: var(--success);
    }

    .review-item.fail .review-item-header {
      color: var(--danger);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .card {
        padding: 22px 18px;
      }
      .header h1 {
        font-size: 1.45rem;
      }
      .question-title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation retour -->
    <nav style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.88rem;">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--primary); text-decoration: none; background: white; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.04); transition: all 0.2s ease;">
        ← Retour au portail
      </a>
      <a href="index.html" style="font-weight: 600; color: var(--secondary); text-decoration: none;">
        Module DOO
      </a>
    </nav>

    <!-- En-tête institutionnel -->
    <div class="header">
      <div class="badge-enssat">ENSSAT <span>/</span> IAI 1 <span>•</span> DÉVELOPPEMENT OBJET I</div>
      <h1>Quiz 1 : Fondements POO & Associations UML</h1>
      <p>Auto-évaluation formative en 12 questions avec correction pas-à-pas et score final</p>
    </div>

    <!-- Carte interactive principale -->
    <div class="card" id="quiz-card">
      <!-- Barre de progression -->
      <div class="progress-container">
        <div class="progress-meta">
          <span id="progress-text">Question 1 sur 12</span>
          <span class="current-score" id="score-counter">Score actuel : 0 / 0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width: 8.33%;"></div>
        </div>
      </div>

      <!-- Zone de Question -->
      <div id="question-container">
        <div class="question-title" id="q-title">Chargement de la question...</div>
        <div class="question-text" id="q-text"></div>

        <div class="choices-list" id="choices-list">
          <!-- Injecté par JavaScript -->
        </div>

        <div id="feedback-container"></div>
      </div>

      <!-- Barre d'actions -->
      <div class="actions">
        <button class="btn btn-primary" id="btn-validate" disabled>Valider ma réponse</button>
        <button class="btn btn-accent" id="btn-next" style="display: none;">Question suivante →</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        title: "1. Origine et motivation de l'approche objet",
        text: "Quelle est la cause fondamentale de la « crise du logiciel » qui a motivé l'émergence de la programmation orientée objet face au modèle procédural classique ?",
        choices: [
          { text: "L'absence de compilateurs suffisamment rapides dans les années 1970.", correct: false },
          { text: "Le découplage historique entre les structures de données passives et les procédures qui les manipulent.", correct: true },
          { text: "L'incapacité du langage C à effectuer des calculs en virgule flottante.", correct: false },
          { text: "Le manque de puissance de calcul des machines de l'époque.", correct: false }
        ],
        feedback: "En approche procédurale, les données et les traitements sont séparés. Lorsque les données évoluent, toutes les procédures doivent être réécrites. La POO résout ce problème en encapsulant les données et les traitements au sein d'une même entité : l'objet."
      },
      {
        title: "2. Le principe d'encapsulation",
        text: "En quoi consiste exactement le principe d'encapsulation ?",
        choices: [
          { text: "Regrouper tous les fichiers sources du projet dans une seule archive .jar.", correct: false },
          { text: "Masquer les détails d'implémentation et l'état interne d'un objet en n'autorisant sa manipulation que via son interface publique.", correct: true },
          { text: "Déclarer systématiquement tous les attributs en visibilité publique pour faciliter la communication.", correct: false },
          { text: "Forcer toutes les classes à hériter d'une super-classe unique.", correct: false }
        ],
        feedback: "L'encapsulation protège l'intégrité de l'état interne de l'objet (invariants de classe) et permet de modifier la réalisation interne sans impacter les utilisateurs (clients) de l'objet."
      },
      {
        title: "3. Caractérisation formelle d'un objet",
        text: "Selon le formalisme vu en cours, comment se définit formellement un objet ?",
        choices: [
          { text: "Un doublet ⟨Nom, Valeur⟩.", correct: false },
          { text: "Un triplet ⟨OID, Classe, État⟩.", correct: true },
          { text: "Une suite d'octets allouée statiquement lors de la compilation.", correct: false },
          { text: "Un ensemble de fonctions sans état interne.", correct: false }
        ],
        feedback: "Un objet est caractérisé de manière unique et complète par son identifiant absolu (OID), sa Classe d'appartenance (qui définit son comportement) et son État (les valeurs instantanées de ses attributs)."
      },
      {
        title: "4. Identité vs Égalité d'objets",
        text: "Soient deux variables désignant deux objets o1 et o2. Laquelle de ces affirmations est rigoureusement exacte ?",
        choices: [
          { text: "Si o1 et o2 ont le même état, alors ils ont nécessairement le même OID.", correct: false },
          { text: "Deux objets distincts créés par deux appels successifs à new ont le même OID s'ils ont les mêmes valeurs.", correct: false },
          { text: "Si deux objets sont identiques (OID(o1) = OID(o2)), alors ils sont nécessairement égaux en état.", correct: true },
          { text: "L'identité et l'égalité sont deux notions strictement équivalentes en informatique.", correct: false }
        ],
        feedback: "L'identité implique l'égalité (Identité(o1, o2) ⟹ Égalité(o1, o2)) car il s'agit physiquement du même objet en mémoire. En revanche, la réciproque est fausse : deux objets distincts (deux OID différents) peuvent avoir des états identiques à un instant t."
      },
      {
        title: "5. Navigation dans le graphe d'objets",
        text: "Dans le cas canonique Employé / Site vu en cours, si l'objet o10 représente le site de Paris avec l'attribut chef pointant vers o1 (Martin), que renvoie l'expression de chemin (path expression) o10.chef.nom ?",
        choices: [
          { text: "Une référence vers l'objet o10.", correct: false },
          { text: "La liste de tous les employés du site.", correct: false },
          { text: "La chaîne de caractères \"Martin\".", correct: true },
          { text: "Une erreur de syntaxe car on ne peut pas enchaîner les liens.", correct: false }
        ],
        feedback: "Les liens monovalués permettent de naviguer de référence en référence : o10.chef résout l'OID o1, puis o1.nom extrait la valeur de l'attribut du chef, soit \"Martin\"."
      },
      {
        title: "6. Classe vs Objet",
        text: "Quelle est la distinction fondamentale entre une Classe et un Objet ?",
        choices: [
          { text: "La classe s'exécute en mémoire vive, l'objet n'existe que dans le code source.", correct: false },
          { text: "La classe est le modèle abstrait (le moule) défini au niveau du code ; l'objet est l'instance concrète allouée en mémoire à l'exécution.", correct: true },
          { text: "Une classe ne contient que des méthodes, un objet ne contient que des données.", correct: false },
          { text: "Il ne peut exister qu'un seul objet par classe dans une application.", correct: false }
        ],
        feedback: "La classe est le plan d'architecte / le moule défini à la compilation. L'objet est la maison bâtie / l'entité vivante allouée dynamiquement en mémoire lors de l'instanciation (new)."
      },
      {
        title: "7. Structure d'une classe en UML",
        text: "Quels sont, de haut en bas, les trois compartiments normalisés d'une boîte de classe UML ?",
        choices: [
          { text: "Méthodes / Attributs / Nom de la classe.", correct: false },
          { text: "Nom de la classe / Attributs / Opérations (Méthodes).", correct: true },
          { text: "Nom de la classe / Paramètres génériques / Commentaires.", correct: false },
          { text: "Paquetage / Attributs / Constructeurs.", correct: false }
        ],
        feedback: "La norme UML impose 3 compartiments : 1. Nom de la classe (en gras, centré), 2. Attributs (données mémorisant l'état), 3. Opérations/Méthodes (services offerts par la classe)."
      },
      {
        title: "8. Modificateurs de visibilité UML",
        text: "Dans un diagramme de classes UML, que signifie le symbole '+' placé devant le nom d'un membre, et comment repère-t-on un membre de classe (static) ?",
        choices: [
          { text: "'+' signifie Protected ; les membres static sont écrits en italique.", correct: false },
          { text: "'+' signifie Package ; les membres static sont précédés d'un astérisque.", correct: false },
          { text: "'+' signifie Public ; les membres static sont représentés soulignés.", correct: true },
          { text: "'+' signifie Private ; les membres static sont écrits en gras.", correct: false }
        ],
        feedback: "Les visibilités UML sont : '+' (public), '-' (private), '#' (protected), '~' (package). La norme UML stipule que tout membre statique (de classe) est souligné."
      },
      {
        title: "9. Notation d'une instance en UML",
        text: "Comment note-t-on correctement une instance (un objet) dans un diagramme d'objets UML ?",
        choices: [
          { text: "NomObjet : NomClasse sans soulignement.", correct: false },
          { text: "nomObjet : NomClasse (nom complet obligatoirement souligné).", correct: true },
          { text: "<<instance>> NomObjet.", correct: false },
          { text: "[NomClasse] -> NomObjet.", correct: false }
        ],
        feedback: "En UML, un objet se distingue d'une classe par le fait que son identifiant complet est obligatoirement souligné : nomObjet : NomClasse (ou : NomClasse pour une instance anonyme)."
      },
      {
        title: "10. Règle de lecture canonique des multiplicités",
        text: "Soit l'association binaire : Salarié (1..*) ----------- (1) Site.\nComment lit-on correctement la multiplicité '1' située du côté de la classe Site ?",
        choices: [
          { text: "Un site emploie exactement 1 salarié.", correct: false },
          { text: "Pour un salarié donné, celui-ci est affecté à exactement 1 site.", correct: true },
          { text: "Tous les salariés sont obligatoirement regroupés sur un seul et unique site de l'entreprise.", correct: false },
          { text: "Un site peut exister sans aucun salarié.", correct: false }
        ],
        feedback: "Règle canonique d'UML : la multiplicité située sur une terminaison cible contraint le nombre d'objets cibles associés à un seul objet donné de la classe source. Donc pour un salarié donné ⟹ exactement 1 site."
      },
      {
        title: "11. Navigabilité d'une association",
        text: "Que signifie une flèche ouverte orientée de la classe A vers la classe B sur un trait d'association (A ------> B) ?",
        choices: [
          { text: "La classe A hérite de la classe B.", correct: false },
          { text: "La classe B contient une référence vers la classe A, mais A ignore l'existence de B.", correct: false },
          { text: "L'association est navigable de A vers B : A connaît B (détient une référence), mais B ne connaît pas A.", correct: true },
          { text: "La classe A envoie obligatoirement un signal asynchrone à B.", correct: false }
        ],
        feedback: "La navigabilité traduit la visibilité logicielle : une flèche orientée de A vers B signifie qu'un objet de type A possède un moyen d'accès direct (attribut/référence) vers B, sans liaison réciproque de B vers A."
      },
      {
        title: "12. Association qualifiée",
        text: "Quel est le rôle précis d'un qualificatif (petit rectangle accolé à une classe source) dans une association qualifiée ?",
        choices: [
          { text: "Remplacer une relation d'héritage par une composition.", correct: false },
          { text: "Agir comme une clé ou un index pour sélectionner un objet cible unique parmi une collection, réduisant ainsi la multiplicité (ex: de * à 0..1).", correct: true },
          { text: "Indiquer que l'association est temporaire et disparaîtra après l'exécution.", correct: false },
          { text: "Obliger tous les objets de la classe cible à porter le même nom.", correct: false }
        ],
        feedback: "L'association qualifiée modélise un index, un dictionnaire ou une table de hachage (Map<Clé, Valeur>). En fournissant la valeur du qualificatif (ex. un numéro de compte ou un code postal), on accède directement à l'objet cible unitaire (0..1 ou 1) plutôt qu'à une collection indistincte (*)."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let selectedChoiceIndex = null;
    let userAnswers = [];

    const letters = ['A', 'B', 'C', 'D'];

    function loadQuestion(index) {
      const q = questions[index];
      selectedChoiceIndex = null;

      // Metas
      document.getElementById('progress-text').textContent = `Question ${index + 1} sur ${questions.length}`;
      document.getElementById('progress-fill').style.width = `${((index + 1) / questions.length) * 100}%`;
      document.getElementById('score-counter').textContent = `Score : ${score} / ${index}`;

      document.getElementById('q-title').textContent = q.title;
      document.getElementById('q-text').textContent = q.text;

      // Clear feedback
      document.getElementById('feedback-container').innerHTML = '';

      // Choices
      const list = document.getElementById('choices-list');
      list.innerHTML = '';

      q.choices.forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'choice-item';
        item.innerHTML = `
          <div class="choice-letter">${letters[i]}</div>
          <div class="choice-text">${c.text}</div>
        `;
        item.addEventListener('click', () => {
          if (item.classList.contains('locked')) return;
          document.querySelectorAll('.choice-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          selectedChoiceIndex = i;
          document.getElementById('btn-validate').disabled = false;
        });
        list.appendChild(item);
      });

      document.getElementById('btn-validate').style.display = 'inline-flex';
      document.getElementById('btn-validate').disabled = true;
      document.getElementById('btn-next').style.display = 'none';
    }

    function validateAnswer() {
      if (selectedChoiceIndex === null) return;

      const q = questions[currentIndex];
      const items = document.querySelectorAll('.choice-item');
      const isCorrect = q.choices[selectedChoiceIndex].correct;

      if (isCorrect) score++;

      userAnswers.push({
        qIndex: currentIndex,
        chosen: selectedChoiceIndex,
        correct: isCorrect
      });

      // Style choices
      items.forEach((item, i) => {
        item.classList.add('locked');
        if (q.choices[i].correct) {
          item.classList.add('correct');
        } else if (i === selectedChoiceIndex && !isCorrect) {
          item.classList.add('incorrect');
        }
      });

      // Show feedback
      const feedbackBox = document.createElement('div');
      feedbackBox.className = `feedback-box ${isCorrect ? 'correct' : 'incorrect'}`;
      feedbackBox.innerHTML = `
        <div class="feedback-header">
          ${isCorrect ? '✓ Exact ! Excellente analyse.' : '✗ Oups ! Ce n\'est pas tout à fait ça.'}
        </div>
        <div class="feedback-text">
          <strong>Éclairage notionnel :</strong> ${q.feedback}
        </div>
      `;
      document.getElementById('feedback-container').appendChild(feedbackBox);

      // Buttons
      document.getElementById('btn-validate').style.display = 'none';
      const btnNext = document.getElementById('btn-next');
      btnNext.style.display = 'inline-flex';
      btnNext.textContent = (currentIndex < questions.length - 1) ? 'Question suivante →' : 'Voir mon score final →';
      document.getElementById('score-counter').textContent = `Score : ${score} / ${currentIndex + 1}`;
    }

    function showResults() {
      const pct = Math.round((score / questions.length) * 100);
      let badgeClass = 'badge-good';
      let badgeText = 'Bonne maîtrise d\'ensemble';
      let message = 'Vous avez assimilé la majeure partie des concepts de ce chapitre. Quelques détails méritent d\'être revus.';

      if (pct >= 90) {
        badgeClass = 'badge-excellent';
        badgeText = '🏆 Maîtrise Exceptionnelle !';
        message = 'Félicitations ! Vos bases conceptuelles en POO et modélisation UML sont particulièrement solides.';
      } else if (pct < 60) {
        badgeClass = 'badge-review';
        badgeText = '⚠️ Révisions recommandées';
        message = 'Certaines distinctions clés (égalité vs identité, lecture des multiplicités, encapsulation) nécessitent un retour attentif sur les transparents du cours.';
      }

      let reviewHtml = '';
      userAnswers.forEach((ans, i) => {
        const q = questions[ans.qIndex];
        reviewHtml += `
          <div class="review-item ${ans.correct ? 'pass' : 'fail'}">
            <div class="review-item-header">
              <span>Question ${i + 1} : ${ans.correct ? '✓ Validée' : '✗ Erreur'}</span>
              <span>${ans.correct ? '+1 pt' : '0 pt'}</span>
            </div>
            <p style="font-weight: 600; margin-bottom: 4px; color: var(--text);">${q.title}</p>
            <p style="font-size: 0.9rem; color: var(--text-muted);">${q.feedback}</p>
          </div>
        `;
      });

      const card = document.getElementById('quiz-card');
      card.innerHTML = `
        <div class="results-card">
          <div class="score-circle">
            <div class="score-value">${score}</div>
            <div class="score-total">sur ${questions.length}</div>
          </div>
          <div class="result-badge ${badgeClass}">${badgeText} (${pct}%)</div>
          <p class="result-message">${message}</p>
          
          <button class="btn btn-primary" onclick="location.reload()">Recommencer le quiz</button>

          <div class="review-list">
            <h3 style="color: var(--primary); margin-bottom: 16px; font-size: 1.15rem;">📋 Récapitulatif détaillé de vos réponses :</h3>
            ${reviewHtml}
          </div>
        </div>
      `;
    }

    document.getElementById('btn-validate').addEventListener('click', validateAnswer);
    document.getElementById('btn-next').addEventListener('click', () => {
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion(currentIndex);
      } else {
        showResults();
      }
    });

    // Initialisation
    loadQuestion(0);
  </script>
</body>
</html>
