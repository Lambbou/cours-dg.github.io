<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 2 : Relations Avancées & Diagrammes d'États — ENSSAT IAI 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003366;
      --primary-light: #0055a5;
      --secondary: #0077b6;
      --accent: #e65100;
      --accent-light: #ff833a;
      --dark: #212529;
      --light-bg: #f5f7fa;
      --card-bg: #ffffff;
      --success: #28a745;
      --success-light: #e8f5e9;
      --danger: #dc3545;
      --danger-light: #ffebee;
      --border: #e2e8f0;
      --text: #2d3748;
      --text-muted: #718096;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(0, 51, 102, 0.08), 0 8px 10px -6px rgba(0, 51, 102, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2eafc 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-enssat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 51, 102, 0.2);
    }

    .badge-enssat span {
      color: var(--accent-light);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 32px 28px;
      transition: all 0.3s ease;
    }

    /* Progress bar */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-meta .current-score {
      color: var(--secondary);
      font-weight: 700;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary) 0%, var(--accent) 100%);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* Question content */
    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .question-text {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Choices */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .choice-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .choice-item:hover:not(.locked) {
      border-color: var(--secondary);
      background: #f0f8ff;
      transform: translateY(-1px);
    }

    .choice-letter {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #edf2f7;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .choice-item:hover:not(.locked) .choice-letter {
      background: var(--secondary);
      color: white;
    }

    .choice-item.selected {
      border-color: var(--secondary);
      background: #e6f3fa;
    }

    .choice-item.selected .choice-letter {
      background: var(--secondary);
      color: white;
    }

    /* Feedback states */
    .choice-item.correct {
      border-color: var(--success) !important;
      background: var(--success-light) !important;
      color: #1b5e20;
    }

    .choice-item.correct .choice-letter {
      background: var(--success) !important;
      color: white !important;
    }

    .choice-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-light) !important;
      color: #b71c1c;
    }

    .choice-item.incorrect .choice-letter {
      background: var(--danger) !important;
      color: white !important;
    }

    .choice-item.locked {
      cursor: default;
    }

    /* Feedback box */
    .feedback-box {
      margin-top: 20px;
      padding: 18px 20px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 5px solid var(--secondary);
      animation: fadeIn 0.3s ease;
    }

    .feedback-box.correct {
      border-left-color: var(--success);
      background: #f0fdf4;
    }

    .feedback-box.incorrect {
      border-left-color: var(--danger);
      background: #fef2f2;
    }

    .feedback-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .feedback-box.correct .feedback-header {
      color: #15803d;
    }

    .feedback-box.incorrect .feedback-header {
      color: #b91c1c;
    }

    .feedback-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #334155;
    }

    /* Action buttons */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 51, 102, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-accent {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(230, 81, 0, 0.25);
    }

    .btn-accent:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    /* Results Screen */
    .results-card {
      text-align: center;
      padding: 40px 24px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(0, 119, 182, 0.3);
    }

    .score-value {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-total {
      font-size: 0.95rem;
      opacity: 0.85;
      font-weight: 600;
    }

    .result-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 14px;
    }

    .badge-excellent {
      background: #dcfce7;
      color: #166534;
    }

    .badge-good {
      background: #e0f2fe;
      color: #075985;
    }

    .badge-review {
      background: #fef3c7;
      color: #92400e;
    }

    .result-message {
      color: var(--text);
      font-size: 1rem;
      line-height: 1.5;
      max-width: 540px;
      margin: 0 auto 30px;
    }

    .review-list {
      text-align: left;
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .review-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .review-item.pass .review-item-header {
      color: var(--success);
    }

    .review-item.fail .review-item-header {
      color: var(--danger);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .card {
        padding: 22px 18px;
      }
      .header h1 {
        font-size: 1.45rem;
      }
      .question-title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation retour -->
    <nav style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.88rem;">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--primary); text-decoration: none; background: white; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.04); transition: all 0.2s ease;">
        ← Retour au portail
      </a>
      <a href="index.html" style="font-weight: 600; color: var(--secondary); text-decoration: none;">
        Module DOO
      </a>
    </nav>

    <!-- En-tête institutionnel -->
    <div class="header">
      <div class="badge-enssat">ENSSAT <span>/</span> IAI 1 <span>•</span> DÉVELOPPEMENT OBJET I</div>
      <h1>Quiz 2 : Relations Avancées & Diagrammes d'États</h1>
      <p>Auto-évaluation formative en 12 questions avec correction pas-à-pas et score final</p>
    </div>

    <!-- Carte interactive principale -->
    <div class="card" id="quiz-card">
      <!-- Barre de progression -->
      <div class="progress-container">
        <div class="progress-meta">
          <span id="progress-text">Question 1 sur 12</span>
          <span class="current-score" id="score-counter">Score actuel : 0 / 0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width: 8.33%;"></div>
        </div>
      </div>

      <!-- Zone de Question -->
      <div id="question-container">
        <div class="question-title" id="q-title">Chargement de la question...</div>
        <div class="question-text" id="q-text"></div>

        <div class="choices-list" id="choices-list">
          <!-- Injecté par JavaScript -->
        </div>

        <div id="feedback-container"></div>
      </div>

      <!-- Barre d'actions -->
      <div class="actions">
        <button class="btn btn-primary" id="btn-validate" disabled>Valider ma réponse</button>
        <button class="btn btn-accent" id="btn-next" style="display: none;">Question suivante →</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        title: "1. Agrégation vs Composition : Cycle de vie & Dépendance existentielle",
        text: "Quelle est la différence fondamentale entre une agrégation faible (⋄) et une composition forte (♦) en UML ?",
        choices: [
          { text: "L'agrégation implique obligatoirement la destruction conjointe des composants lors de la destruction du composite.", correct: false },
          { text: "La composition (♦) établit une possession existentielle stricte : la destruction du composite entraîne automatiquement la destruction de ses composants.", correct: true },
          { text: "L'agrégation ne peut relier que des types primitifs alors que la composition lie des objets.", correct: false },
          { text: "La composition autorise un composant à appartenir simultanément à plusieurs composites distincts.", correct: false }
        ],
        feedback: "Dans une composition forte (♦), le composite est le propriétaire exclusif de ses parties et gère leur cycle de vie (ex. Personne et Cerveau). Si le composite disparaît, ses composants disparaissent. Dans une agrégation faible (⋄), les composants survivent à la disparition du composite (ex. Université et Enseignants)."
      },
      {
        title: "2. Contrainte de multiplicité sur la composition",
        text: "Dans une relation de composition (♦), quelle contrainte rigoureuse pèse sur la multiplicité du côté de la classe composite ?",
        choices: [
          { text: "La multiplicité doit être strictement multivaluée (* ou 1..*).", correct: false },
          { text: "La multiplicité doit être au plus 1 (1 ou 0..1).", correct: true },
          { text: "Aucune contrainte : la multiplicité peut être quelconque.", correct: false },
          { text: "La multiplicité côté composite doit être égale à la multiplicité côté composant.", correct: false }
        ],
        feedback: "Un composant ne peut être possédé que par au plus un seul composite à la fois (possession non partagée). La multiplicité du côté du composite est donc impérativement 1 (ou 0..1 avant rattachement)."
      },
      {
        title: "3. Propriétés formelles de la relation d'héritage",
        text: "Parmi les propositions suivantes concernant la relation d'héritage (C2 ⩽ C1), laquelle est FAUSSE ?",
        choices: [
          { text: "L'héritage est réflexif : toute classe dérive d'elle-même (C ⩽ C).", correct: false },
          { text: "L'héritage est transitif : si C3 ⩽ C2 et C2 ⩽ C1, alors C3 ⩽ C1.", correct: false },
          { text: "L'héritage est symétrique : si C2 ⩽ C1, alors C1 ⩽ C2.", correct: true },
          { text: "L'héritage organise les classes sous forme d'une hiérarchie d'ordre partiel orientée.", correct: false }
        ],
        feedback: "L'héritage est une relation d'ordre partiel : il est réflexif, transitif et antisymétrique (asymétrique stricte pour des classes distinctes : il ne peut pas y avoir de cycles d'héritage tels que A hérite de B et B hérite de A). Il n'est donc absolument pas symétrique."
      },
      {
        title: "4. Redéfinition (Overriding) et Affinement",
        text: "Lorsqu'une sous-classe effectue un « affinement » d'une méthode héritée de sa super-classe, que réalise-t-elle concrètement ?",
        choices: [
          { text: "Elle change la signature de la méthode pour créer une surcharge statique.", correct: false },
          { text: "Elle réécrit le traitement sans réutiliser le code de la classe mère.", correct: false },
          { text: "Elle conserve le comportement parent (via un appel à la méthode mère) tout en y ajoutant du traitement spécifique.", correct: true },
          { text: "Elle réduit la visibilité de la méthode en la déclarant privée.", correct: false }
        ],
        feedback: "L'affinement spécialise un comportement sans le perdre : la classe dérivée redéfinit la méthode avec la même signature, délègue le traitement générique à la classe parente (ex. via super en Java), et y incorpore ses traitements spécifiques."
      },
      {
        title: "5. Héritage multiple et problème du diamant",
        text: "Pourquoi Java proscrit-il l'héritage multiple entre classes ?",
        choices: [
          { text: "Pour éviter le problème du diamant : l'ambiguïté insoluble sur le choix de la méthode à exécuter lorsqu'une classe hérite de deux classes redéfinissant différemment une méthode d'un ancêtre commun.", correct: true },
          { text: "Parce que la machine virtuelle Java est limitée à 32 classes au total en mémoire.", correct: false },
          { text: "Parce que le mot-clé extends n'accepte pas la syntaxe avec des virgules.", correct: false },
          { text: "Pour forcer les développeurs à n'utiliser que des fonctions statiques.", correct: false }
        ],
        feedback: "Le conflit du diamant pose un dilemme de résolution d'attributs et de méthodes concurrents. Java élimine ce risque à la racine en interdisant l'héritage multiple de classe (single inheritance) tout en autorisant l'implémentation multiple d'interfaces."
      },
      {
        title: "6. Polymorphisme en UML",
        text: "Dans la modélisation Employé (Ingénieur, Chercheur), en quoi consiste le polymorphisme lors de l'envoi du message prime() ?",
        choices: [
          { text: "L'émetteur du message doit tester dynamiquement le type concret avec des if/else avant d'invoquer la méthode.", correct: false },
          { text: "L'opération s'adapte dynamiquement selon la classe réelle de l'objet récepteur, l'émetteur manipulant une référence générique sans connaître la variante concrète.", correct: true },
          { text: "La méthode prime() a obligatoirement le même algorithme identique dans toutes les classes filles.", correct: false },
          { text: "Le polymorphisme interdit toute redéfinition ultérieure dans les classes filles.", correct: false }
        ],
        feedback: "Le polymorphisme permet d'écrire du code découplé : l'émetteur demande prime() à un Employe quelconque ; c'est le mécanisme de liaison dynamique qui sélectionne automatiquement le calcul propre à l'Ingénieur ou au Chercheur selon l'instance réelle."
      },
      {
        title: "7. Taxonomie des collections UML",
        text: "Quelle est la différence sémantique fondamentale entre un Ensemble (Set) et une Liste (List) ?",
        choices: [
          { text: "Un Ensemble est ordonné par un index numérique alors qu'une Liste ne l'est pas.", correct: false },
          { text: "Un Ensemble garantit l'unicité des éléments (aucun doublon) sans ordre imposé, alors qu'une Liste maintient un ordonnancement précis et autorise les doublons.", correct: true },
          { text: "Une Liste ne peut stocker que des entiers et un Ensemble que des chaînes de caractères.", correct: false },
          { text: "Un Ensemble autorise les doublons alors qu'une Liste les élimine systématiquement.", correct: false }
        ],
        feedback: "Dans la hiérarchie des collections : l'Ensemble (Set) garantit l'unicité stricte sans notion d'index séquentiel ; la Liste (List) garantit un ordre d'insertion accessible par index avec doublons possibles ; le Multi-ensemble (Bag) autorise les doublons sans ordre."
      },
      {
        title: "8. Diagramme d'états : Syntaxe canonique d'une transition",
        text: "Dans un diagramme d'états-transitions UML, quelle est la structure formelle de l'étiquette portée par une transition ?",
        choices: [
          { text: "Action [Événement] / Garde", correct: false },
          { text: "Événement [Garde] / Action", correct: true },
          { text: "[Garde] -> Événement : Action", correct: false },
          { text: "État_Source / Action [Garde]", correct: false }
        ],
        feedback: "La syntaxe normalisée UML est : Événement [Garde] / Action. L'événement est le stimulus déclencheur, la garde est la condition booléenne requise, et l'action est l'effet atomique produit lors du franchissement."
      },
      {
        title: "9. Activités internes à un état (entry, do, exit)",
        text: "À l'intérieur d'un état UML, quelle action s'exécute de façon continue et interruptible tant que l'objet y séjourne ?",
        choices: [
          { text: "entry / action", correct: false },
          { text: "exit / action", correct: false },
          { text: "do / activité", correct: true },
          { text: "after / délai", correct: false }
        ],
        feedback: "entry s'exécute instantanément à l'entrée dans l'état ; exit s'exécute juste avant d'en sortir ; do / activité désigne une activité durable qui s'exécute tant que l'objet séjourne dans l'état et s'interrompt dès qu'une transition sortante est déclenchée."
      },
      {
        title: "10. Transition interne vs Transition externe",
        text: "Quelle est la particularité essentielle d'une transition interne à un état ?",
        choices: [
          { text: "Elle provoque une transition directe vers l'état final du système.", correct: false },
          { text: "Elle traite un événement et exécute une action sans quitter l'état courant, évitant ainsi d'exécuter les actions exit et entry.", correct: true },
          { text: "Elle est obligatoirement déclenchée par un minuteur (after).", correct: false },
          { text: "Elle supprime l'objet de la mémoire vive.", correct: false }
        ],
        feedback: "Une transition interne réagit à un stimulus interne sans modifier l'état actif de l'objet. Par conséquent, aucune action de sortie (exit) ni de rentrée (entry) n'est exécutée, ce qui la distingue d'une auto-transition externe reliant l'état à lui-même."
      },
      {
        title: "11. Transitions complexes : Fork et Join",
        text: "Dans un diagramme d'états, quelle est la fonction respective d'une barre de Fork et d'une barre de Join ?",
        choices: [
          { text: "Le Fork synchronise plusieurs branches et le Join les divise en sous-états séquentiels.", correct: false },
          { text: "Le Fork scinde une transition en plusieurs branches concurrentes actives en parallèle ; le Join synchronise la fin de ces branches concurrentes avant de poursuivre.", correct: true },
          { text: "Le Fork crée un nouvel objet et le Join détruit l'ancien objet.", correct: false },
          { text: "Le Fork représente un point de choix conditionnel (OU) et le Join une boucle.", correct: false }
        ],
        feedback: "Le Fork (dédoublement) permet d'activer simultanément plusieurs sous-états dans des régions concurrentes. Le Join (synchronisation) attend que toutes les régions concurrentes entrantes aient atteint leur condition de sortie pour franchir la transition aval."
      },
      {
        title: "12. Chronologie d'exécution lors de la sortie d'un état composite",
        text: "Lorsqu'un événement provoque la sortie d'un sous-état vers l'extérieur d'un état composite, quel est l'ordre chronologique exact d'exécution ?",
        choices: [
          { text: "exit du composite ⟹ exit du sous-état ⟹ action de la transition.", correct: false },
          { text: "Arrêt du do et exit du sous-état ⟹ exit de l'état composite ⟹ action de la transition.", correct: true },
          { text: "Action de la transition ⟹ exit du sous-état ⟹ exit du composite.", correct: false },
          { text: "entry de l'état cible ⟹ exit de l'état composite ⟹ exit du sous-état.", correct: false }
        ],
        feedback: "L'ordre de sortie est rigoureusement centrifuge (du plus imbriqué vers l'extérieur) : interruption de l'activité do du sous-état ⟹ exécution de son action exit ⟹ exécution de l'action exit de l'état composite englobant ⟹ exécution de l'action portée par la transition de sortie."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let selectedChoiceIndex = null;
    let userAnswers = [];

    const letters = ['A', 'B', 'C', 'D'];

    function loadQuestion(index) {
      const q = questions[index];
      selectedChoiceIndex = null;

      document.getElementById('progress-text').textContent = `Question ${index + 1} sur ${questions.length}`;
      document.getElementById('progress-fill').style.width = `${((index + 1) / questions.length) * 100}%`;
      document.getElementById('score-counter').textContent = `Score : ${score} / ${index}`;

      document.getElementById('q-title').textContent = q.title;
      document.getElementById('q-text').textContent = q.text;

      document.getElementById('feedback-container').innerHTML = '';

      const list = document.getElementById('choices-list');
      list.innerHTML = '';

      q.choices.forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'choice-item';
        item.innerHTML = `
          <div class="choice-letter">${letters[i]}</div>
          <div class="choice-text">${c.text}</div>
        `;
        item.addEventListener('click', () => {
          if (item.classList.contains('locked')) return;
          document.querySelectorAll('.choice-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          selectedChoiceIndex = i;
          document.getElementById('btn-validate').disabled = false;
        });
        list.appendChild(item);
      });

      document.getElementById('btn-validate').style.display = 'inline-flex';
      document.getElementById('btn-validate').disabled = true;
      document.getElementById('btn-next').style.display = 'none';
    }

    function validateAnswer() {
      if (selectedChoiceIndex === null) return;

      const q = questions[currentIndex];
      const items = document.querySelectorAll('.choice-item');
      const isCorrect = q.choices[selectedChoiceIndex].correct;

      if (isCorrect) score++;

      userAnswers.push({
        qIndex: currentIndex,
        chosen: selectedChoiceIndex,
        correct: isCorrect
      });

      items.forEach((item, i) => {
        item.classList.add('locked');
        if (q.choices[i].correct) {
          item.classList.add('correct');
        } else if (i === selectedChoiceIndex && !isCorrect) {
          item.classList.add('incorrect');
        }
      });

      const feedbackBox = document.createElement('div');
      feedbackBox.className = `feedback-box ${isCorrect ? 'correct' : 'incorrect'}`;
      feedbackBox.innerHTML = `
        <div class="feedback-header">
          ${isCorrect ? '✓ Exact ! Excellente déduction.' : '✗ Erreur sur cette question.'}
        </div>
        <div class="feedback-text">
          <strong>Éclairage notionnel :</strong> ${q.feedback}
        </div>
      `;
      document.getElementById('feedback-container').appendChild(feedbackBox);

      document.getElementById('btn-validate').style.display = 'none';
      const btnNext = document.getElementById('btn-next');
      btnNext.style.display = 'inline-flex';
      btnNext.textContent = (currentIndex < questions.length - 1) ? 'Question suivante →' : 'Voir mon score final →';
      document.getElementById('score-counter').textContent = `Score : ${score} / ${currentIndex + 1}`;
    }

    function showResults() {
      const pct = Math.round((score / questions.length) * 100);
      let badgeClass = 'badge-good';
      let badgeText = 'Bonne maîtrise d\'ensemble';
      let message = 'Vous maîtrisez l\'essentiel des mécanismes avancés (héritage, transitions et états composites).';

      if (pct >= 90) {
        badgeClass = 'badge-excellent';
        badgeText = '🏆 Maîtrise Remarquable !';
        message = 'Félicitations ! Vos compétences en modélisation avancée et conception objet sont très solides.';
      } else if (pct < 60) {
        badgeClass = 'badge-review';
        badgeText = '⚠️ Points critiques à retravailler';
        message = 'Certaines notions (multiplicités de composition, chronologie centrifuge, activités internes) méritent d\'être revues avant les évaluations.';
      }

      let reviewHtml = '';
      userAnswers.forEach((ans, i) => {
        const q = questions[ans.qIndex];
        reviewHtml += `
          <div class="review-item ${ans.correct ? 'pass' : 'fail'}">
            <div class="review-item-header">
              <span>Question ${i + 1} : ${ans.correct ? '✓ Validée' : '✗ Erreur'}</span>
              <span>${ans.correct ? '+1 pt' : '0 pt'}</span>
            </div>
            <p style="font-weight: 600; margin-bottom: 4px; color: var(--text);">${q.title}</p>
            <p style="font-size: 0.9rem; color: var(--text-muted);">${q.feedback}</p>
          </div>
        `;
      });

      const card = document.getElementById('quiz-card');
      card.innerHTML = `
        <div class="results-card">
          <div class="score-circle">
            <div class="score-value">${score}</div>
            <div class="score-total">sur ${questions.length}</div>
          </div>
          <div class="result-badge ${badgeClass}">${badgeText} (${pct}%)</div>
          <p class="result-message">${message}</p>
          
          <button class="btn btn-primary" onclick="location.reload()">Recommencer le quiz</button>

          <div class="review-list">
            <h3 style="color: var(--primary); margin-bottom: 16px; font-size: 1.15rem;">📋 Récapitulatif détaillé de vos réponses :</h3>
            ${reviewHtml}
          </div>
        </div>
      `;
    }

    document.getElementById('btn-validate').addEventListener('click', validateAnswer);
    document.getElementById('btn-next').addEventListener('click', () => {
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion(currentIndex);
      } else {
        showResults();
      }
    });

    loadQuestion(0);
  </script>
</body>
</html>
